const D=JSON.parse(document.getElementById('dataset').textContent),fmt=n=>new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n),compact=n=>new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1}).format(n),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sum=(a,k)=>a.reduce((s,r)=>s+(r[k]||0),0),colors=['#e6bd55','#24b8ac','#6a92d4','#a082cf','#e7896e','#70c296'];let year='all',view='overview',query='',page=0,sort='source';const selected=a=>a.filter(r=>year==='all'||r.year===Number(year));
function panel(title,body,full=false){return `<section class="panel ${full?'full':''}"><h2>${title}</h2>${body}</section>`}
function aggregate(rows,key){const map=new Map;rows.forEach(r=>map.set(r[key],(map.get(r[key])||0)+r.amount));return [...map].map(([name,amount])=>({name,amount})).sort((a,b)=>b.amount-a.amount)}
function ranks(rows){const max=Math.max(...rows.map(r=>Math.abs(r.amount)),1);return `<div class="bars">${rows.map((r,i)=>`<div class="rank-row"><span class="rank-name">${esc(r.name)}</span><div class="track"><div class="fill" style="width:${Math.abs(r.amount)/max*100}%;background:${r.amount<0?'var(--red)':i===0?'var(--gold)':'var(--teal)'}"></div></div><span class="rank-val ${r.amount<0?'negative':''}">${fmt(r.amount)}</span></div>`).join('')}</div>`}
function donut(rows,totalLabel='إيراد'){let data=rows.slice(0,5),other=sum(rows.slice(5),'amount');if(other)data.push({name:'باقي البرامج',amount:other});const total=sum(data,'amount');let position=0;const segments=data.map((r,i)=>{let start=position;position+=r.amount/total*100;return `${colors[i]} ${start}% ${position}%`}).join(',');return `<div class="donut-wrap"><div class="donut" role="img" aria-label="توزيع ${totalLabel}" style="background:conic-gradient(${segments||'var(--line) 0% 100%'})"><div class="donut-inner"><strong>${data.length?compact(total):'0'}</strong><span>ريال · ${totalLabel}</span></div></div><div class="key">${data.map((r,i)=>`<div class="key-row"><span><i style="background:${colors[i]}"></i>${esc(r.name)}</span><b>${total?(r.amount/total*100).toFixed(1):0}%</b></div>`).join('')}</div></div>`}
function annual(){const rows=selected(D.summary),max=Math.max(...rows.map(r=>Math.max(r.revenue,r.expense)),1);return `<div class="legend"><span><i style="background:var(--gold)"></i>الإيرادات</span><span><i style="background:var(--teal)"></i>المصروفات بعد التسويات</span></div><div class="annual">${rows.map(r=>`<div class="group">${[['revenue','var(--gold)'],['expense','var(--teal)']].map(([k,c])=>`<div class="bar" style="height:${r[k]/max*85}%;background:${c}" data-tip="${fmt(r[k])} ر.س"><span class="bar-label">${compact(r[k])}</span></div>`).join('')}<span class="xlabel">${r.year}${r.year===2026?' *':''}</span></div>`).join('')}</div><p class="caption">* بيانات 2026 حتى تحديث أكتوبر؛ ليست سنة مالية مكتملة.</p>`}
function summaryTable(){return `<div class="table-wrap"><table><thead><tr><th>السنة</th><th>الدعم المستلم</th><th>الإيرادات</th><th>المصروفات</th><th>الفائض</th><th>هامش الفائض</th></tr></thead><tbody>${selected(D.summary).map(r=>`<tr><td>${r.year}</td><td class="amount">${r.support===null?'غير مذكور':fmt(r.support)}</td><td class="amount">${fmt(r.revenue)}</td><td class="amount">${fmt(r.expense)}</td><td class="amount positive">${fmt(r.revenue-r.expense)}</td><td>${((r.revenue-r.expense)/r.revenue*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>`}
function notes(){return `<div class="notice">بيانات 2023 من الموقع المرجعي M، وهي إجماليات سنوية للبرامج والبنود الإدارية وليست حركات مؤرخة؛ الدعم لعام 2023 غير مذكور. بيانات 2024–2026 تطابق ملخص الإكسل. المصروفات تشمل القيود السالبة وتسويات مخزون الاختبارات غير المستخدمة. المبلغ النصي «1739.13-» في إيرادات 2026 مستبعد من الجمع كما في المصدر، ويظهر في سجل الإيرادات. الفائض = الإيرادات − المصروفات، دون احتساب الدعم كإيراد.</div>`}
function render(){let rows=selected(D.summary),revenue=sum(rows,'revenue'),expense=sum(rows,'expense'),support=sum(rows,'support'),profit=revenue-expense;const kpis=[['إجمالي الإيرادات',revenue,'ريال سعودي'],['إجمالي المصروفات',expense,'بعد التسويات'],['الفائض المالي',profit,'دون الدعم','positive'],['الدعم المستلم',support,'مؤسسة عبدالله الراجحي'],['الرصيد التراكمي للصندوق',balance(),'من 2024 حتى الفترة المختارة','positive'],['هامش الفائض',revenue?profit/revenue*100:0,'من الإيرادات','','percent']];document.getElementById('kpis').innerHTML=kpis.map(([name,value,unit,cls,type])=>`<article class="kpi"><label>${name}</label><div class="value ${cls||''}">${year==='2023'&&(name==='الرصيد التراكمي للصندوق'||name==='الدعم المستلم')?'غير متاح':type==='percent'?value.toFixed(1)+'%':fmt(value)}</div><span class="unit">${unit}</span></article>`).join('');let programs=aggregate(selected(D.programs),'name');let html='';if(view==='history2023'){html=history2023()}else if(view==='overview'){let top=programs[0];html=`<div class="grid">${panel('الإيرادات والمصروفات السنوية',annual())}${panel('توزيع الإيرادات حسب البرنامج',donut(programs))}${panel('أعلى 10 برامج ومصادر إيراد',ranks(programs.slice(0,10)))}${panel('الفائض المالي حسب السنة',ranks(rows.map(r=>({name:String(r.year),amount:r.revenue-r.expense})))+`<p class="caption">هامش الفائض في الفترة المختارة: ${(profit/revenue*100).toFixed(1)}% من الإيرادات.</p>`)}${panel('الملخص المالي السنوي',summaryTable(),true)}${panel('قراءة الأداء',`<div class="insights"><div class="insight"><strong>أعلى مصدر للإيراد</strong>${esc(top?.name||'—')}<br>${fmt(top?.amount||0)} ريال</div><div class="insight"><strong>تغطية المصروفات</strong>الإيرادات تغطي ${(revenue/expense*100).toFixed(1)}% من المصروفات في الفترة المختارة.</div><div class="insight"><strong>الرصيد والفائض</strong>الرصيد التراكمي يشمل الدعم، بينما الفائض يقيس الفرق بين الإيرادات والمصروفات.</div></div>`+notes(),true)}</div>`}else if(view==='revenue'){html=`<div class="grid">${panel('مساهمة البرامج في الإيرادات',ranks(programs.slice(0,10)))}${panel('إيرادات البرامج حسب السنة',heatmap(),false)}${panel('سجل الإيرادات',`<p class="section-intro">بيانات 2023 إجماليات سنوية، والسنوات التالية دفعات الإيراد كما وردت في المصدر؛ عدد السجلات لا يمثل عدد المتدربين.</p><div id="table-area"></div>`,true)}</div>`}else if(view==='expenses'){let cats=aggregate(selected(D.expenses),'category');html=`<div class="grid">${panel('المصروفات حسب نوع الصرف',ranks(cats))}${panel('الصرف والتسويات',`<div class="stage"><article><h3>المصروفات الموجبة</h3><div class="value">${fmt(sum(selected(D.expenses).filter(r=>r.amount>0),'amount'))}</div><p class="muted">قبل خصم التسويات السالبة</p></article><article><h3>التسويات السالبة</h3><div class="value negative">${fmt(sum(selected(D.expenses).filter(r=>r.amount<0),'amount'))}</div><p class="muted">تشمل المخزون والقيود العكسية</p></article></div>`)}${panel('سجل المصروفات التشغيلية',`<p class="section-intro">الفترة، قيمة الصرف ونوعه؛ بيانات 2023 إجماليات من الموقع المرجعي، وبيانات 2024–2026 من الإكسل.</p><div id="table-area"></div>`,true)}</div>`}else{html=`<div class="grid">${panel('دفعات دعم مؤسسة عبدالله الراجحي الخيرية',paymentTable())}${panel('تطور الرصيد التراكمي',ranks(rows.filter(r=>r.year>=2024).map(r=>({name:'نهاية '+r.year,amount:balance(r.year)}))))}${panel('مقارنة مراحل المشروع',stage(),true)}${panel('الملخص السنوي',summaryTable()+notes(),true)}</div>`}document.getElementById('content').innerHTML=html;if(view==='revenue'||view==='expenses')renderTable()}
function history2023(){return panel('تفاصيل سنة 2023',`<p class="section-intro">جميع بيانات سنة 2023 كما وردت في <a href="https://srtgru-ops.github.io/M/" target="_blank" rel="noopener" style="color:var(--gold)">الموقع المرجعي</a>؛ هذا الجدول ثابت لسنة 2023.</p><div class="insights"><div class="insight"><strong>المسجلون برسوم</strong>391</div><div class="insight"><strong>المسجلون مجانًا</strong>104</div><div class="insight"><strong>إجمالي المسجلين</strong>495</div></div><div class="table-wrap"><table><thead><tr><th>البرنامج / البند</th><th>الفئة</th><th>مسجلون برسوم</th><th>مسجلون مجانًا</th><th>الاختبار</th><th>الإيرادات</th><th>المصروفات</th><th>الربح / الخسارة</th></tr></thead><tbody>${D.history2023.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.category)}</td><td>${r.paidStudents}</td><td>${r.freeStudents}</td><td>${esc(r.examType)}</td><td>${fmt(r.revenue)}</td><td>${fmt(r.expenses)}</td><td class="${r.profit<0?'negative':'positive'}">${fmt(r.profit)}</td></tr>`).join('')}</tbody></table></div><p class="notice">إجمالي الإيرادات 431,520.92 ريال، المصروفات 220,035.06 ريال، وصافي الفائض 211,485.86 ريال. تشمل الإجماليات أكواد الطلاب وتقديم الدورات المجانية. الرصيد التراكمي للصندوق يُحسب من 2024 وفق التقرير المالي، ولا يُعامل فائض 2023 كرصيد افتتاحي موثق.</p>`,true)}
function balance(end){end=end|| (year==='all'?2026:Number(year));return D.summary.filter(r=>r.year>=2024&&r.year<=end).reduce((s,r)=>s+r.support+r.revenue-r.expense,0)}
function heatmap(){let years=selected(D.summary).map(r=>r.year),names=[...new Set(selected(D.programs).map(r=>r.name))];return `<div class="table-wrap" style="max-height:380px"><table><thead><tr><th>البرنامج</th>${years.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody>${names.map(n=>`<tr><td class="desc">${esc(n)}</td>${years.map(y=>{let amount=sum(D.programs.filter(r=>r.year===y&&r.name===n),'amount');return `<td class="amount" style="background:rgba(36,184,172,${Math.min(amount/120000,.75)})">${amount?fmt(amount):'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function paymentTable(){return `<p class="section-intro">إجمالي الدعم: 599,120.00 ريال · اكتمل استلامه في 20 يناير 2025</p><div class="table-wrap"><table><thead><tr><th>الدفعة</th><th>التاريخ</th><th>المبلغ</th></tr></thead><tbody>${selected(D.payments).map(r=>`<tr><td>${r.name}</td><td>${r.date}</td><td class="amount">${fmt(r.amount)}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد دفعات دعم في السنة المختارة.</td></tr>'}</tbody></table></div>`}
function stage(){return `<p class="section-intro">مقارنة ثابتة للفترة الكاملة وفق تصنيف التقرير؛ مرحلة الدعم تشمل بيانات 2024، ومرحلة إعادة الاستثمار تشمل بيانات 2025–2026.</p><div class="stage">${[['خلال فترة الدعم','12 فبراير 2024 – 20 يناير 2025',290764.81,399014.07],['بعد انتهاء الدعم','21 يناير 2025 – تحديث أكتوبر 2026',387432.86,638407.251]].map(([n,d,e,r])=>`<article><h3>${n}</h3><p class="muted">${d}</p><dl><div><dt>الإيرادات</dt><dd>${fmt(r)}</dd></div><div><dt>المصروفات</dt><dd>${fmt(e)}</dd></div><div><dt>الفائض</dt><dd class="positive">${fmt(r-e)}</dd></div></dl></article>`).join('')}</div>`}
function tableRows(){let rows=selected(view==='expenses'?D.expenses:D.transactions).filter(r=>[r.name,r.date,r.method,r.category,r.year].join(' ').toLowerCase().includes(query.toLowerCase()));if(sort==='desc')rows.sort((a,b)=>(b.amount??-Infinity)-(a.amount??-Infinity));if(sort==='asc')rows.sort((a,b)=>(a.amount??Infinity)-(b.amount??Infinity));return rows}
function renderTable(){let rows=tableRows(),pages=Math.max(1,Math.ceil(rows.length/20));page=Math.min(page,pages-1);let expense=view==='expenses';document.getElementById('table-area').innerHTML=`<div class="table-tools"><input id="search" aria-label="بحث في السجل" placeholder="ابحث في البرنامج أو نوع الصرف..." value="${esc(query)}"><select id="sort" aria-label="ترتيب السجل"><option value="source">ترتيب المصدر</option><option value="desc">المبلغ: من الأعلى</option><option value="asc">المبلغ: من الأقل</option></select><button id="export">تصدير CSV</button></div><p class="section-intro">${rows.length} سجل · إجمالي السجلات المعروضة: ${fmt(sum(rows,'amount'))} ريال</p><div class="table-wrap"><table><thead><tr><th>السنة</th><th>الفترة / التاريخ</th><th>${expense?'نوع الصرف':'البرنامج'}</th><th>${expense?'التصنيف':'طريقة السداد'}</th><th>المبلغ</th></tr></thead><tbody>${rows.slice(page*20,(page+1)*20).map(r=>`<tr><td>${r.year}</td><td>${esc(r.date)}</td><td class="desc">${esc(r.name)}</td><td>${esc(expense?r.category:r.method)}</td><td class="amount ${r.amount<0?'negative':''}">${r.amount===null?`${esc(r.raw??'غير محدد')} <span class="muted">(غير محتسب)</span>`:fmt(r.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد نتائج مطابقة.</td></tr>'}</tbody></table></div><div class="pagination"><span>الصفحة ${page+1} من ${pages}</span><div class="actions"><button id="prev" ${page===0?'disabled':''}>السابق</button><button id="next" ${page===pages-1?'disabled':''}>التالي</button></div></div>${notes()}`;document.getElementById('sort').value=sort;document.getElementById('search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;page=0;renderTable();let input=document.getElementById('search');input.focus();input.setSelectionRange(pos,pos)};document.getElementById('sort').onchange=e=>{sort=e.target.value;page=0;renderTable()};document.getElementById('prev').onclick=()=>{page--;renderTable()};document.getElementById('next').onclick=()=>{page++;renderTable()};document.getElementById('export').onclick=exportCsv}
function exportCsv(){let rows=tableRows();let cells=[['السنة','التاريخ','الوصف','التصنيف / السداد','المبلغ'],...rows.map(r=>[r.year,r.date,r.name,r.category||r.method,r.amount??r.raw??''])];let csv='\uFEFF'+cells.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`Da-${view}-${year}.csv`;a.click();URL.revokeObjectURL(url)}
document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{year=b.dataset.year;page=0;document.querySelectorAll('[data-year]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;query='';sort='source';page=0;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render();window.scrollTo({top:0,behavior:'smooth'})});document.getElementById('theme').onclick=()=>{document.body.classList.toggle('light');document.getElementById('theme').textContent=document.body.classList.contains('light')?'الوضع الداكن':'الوضع الفاتح';try{localStorage.setItem('Da-theme',document.body.classList.contains('light')?'light':'dark')}catch{}};document.getElementById('print').onclick=()=>window.print();try{if(localStorage.getItem('Da-theme')==='light'){document.body.classList.add('light');document.getElementById('theme').textContent='الوضع الداكن'}}catch{}render();
</script></body></html>
