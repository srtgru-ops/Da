function renderNorthStudents(track,programIndex=0){
 const rows=northStudents[track],isPro=track==='pro';
 const programs=[...new Set(rows.flatMap(r=>r.programs))];
 const filtered=programIndex===0?rows:rows.filter(r=>r.programs.includes(programs[programIndex-1]));
 const box=document.getElementById('north-student-details');box.hidden=false;
 box.innerHTML=`<div class="north-student-top"><h2>${isPro?'الشهادات الاحترافية':'البرامج التدريبية المجانية'} — تفاصيل البرامج والطلاب</h2><a class="north-download" href="index.html#north">الرجوع للمشروع</a></div>
 <div class="north-programs" aria-label="اختيار البرنامج">${['جميع البرامج',...programs].map((p,i)=>`<button data-program="${i}" aria-pressed="${i===programIndex}">${esc(p)} <strong>(${i===0?rows.length:rows.filter(r=>r.programs.includes(p)).length})</strong></button>`).join('')}</div>
 <div class="north-student-top"><p>${filtered.length} سجلًا${isPro?' · '+filtered.filter(r=>r.status==='نجاح').length+' نجاح · '+filtered.filter(r=>r.status==='رسوب').length+' رسوب':''}</p><a class="north-download" href="assets/north/${track}-${programIndex}.xlsx" download>تصدير Excel</a></div>
 <div class="table-wrap"><table><thead><tr><th>م</th><th>الاسم</th><th>البرنامج</th><th>الحالة</th>${isPro?'<th>حالة الحجز</th>':''}</tr></thead><tbody>${filtered.map((r,i)=>`<tr><td>${i+1}</td><td class="desc">${esc(r.name)}</td><td class="desc">${esc(programIndex===0?r.programs.join('، '):programs[programIndex-1])}</td><td>${esc(r.status)}</td>${isPro?'<td>'+esc(r.booking)+'</td>':''}</tr>`).join('')}</tbody></table></div>`;
 box.querySelectorAll('[data-program]').forEach(b=>b.onclick=()=>renderNorthStudents(track,Number(b.dataset.program)));
 if(programIndex===0)box.scrollIntoView({behavior:'smooth',block:'start'});
}
